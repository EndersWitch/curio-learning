<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Algebra Tiles">
  <title>Algebra Tiles</title>
  <!-- A finished rectangle, (x + 1)(x − 1): x², an x tile beside it, a −x
       tile below, and so a −1 tile in the corner, since its row is negative
       and its column positive. -->
  <rect x="2" y="3" width="18" height="18" rx="2.5" fill="#8fb3ee" stroke="#4a78c8" stroke-width="1.5"/>
  <rect x="22" y="3" width="7" height="18" rx="2" fill="#9fd8b4" stroke="#4f9f6d" stroke-width="1.5"/>
  <rect x="2" y="23" width="18" height="7" rx="2" fill="#f2a196" stroke="#c95b4b" stroke-width="1.5"/>
  <rect x="22" y="23" width="7" height="7" rx="1.5" fill="#f2a196" stroke="#c95b4b" stroke-width="1.5"/>
</svg>
